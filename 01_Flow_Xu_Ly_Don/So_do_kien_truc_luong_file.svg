    <text x="740" y="1025" class="card-title" fill="#cc66ff">📁 03_Ket_qua_Xu_ly/01_Vu_&lt;ten_vu&gt;/QD_Khang_nghi</text>
    <text x="740" y="1050" class="card-desc">• Dự thảo Quyết định Kháng nghị Giám đốc thẩm / Tái thẩm</text>
    <text x="740" y="1070" class="card-desc">• Chuẩn bản phát hành gốc (~30 KB), kiểm soát placeholder</text>
    <text x="740" y="1090" class="card-desc">• Kèm Thông báo giải quyết đơn (TLĐ) chuẩn TB 383/679</text>

    <!-- Card 5.3 -->
    <rect x="1230" y="995" width="480" height="115" class="card-bg"/>
    <text x="1250" y="1025" class="card-title" fill="#00d26a">📁 03_Ket_qua_Xu_ly/01_Vu_&lt;ten_vu&gt;/Bao_cao_6_buoc</text>
    <text x="1250" y="1050" class="card-desc">• Báo cáo nghiên cứu toàn diện từ Bước 1 đến Bước 6</text>
    <text x="1250" y="1070" class="card-desc">• Phục vụ báo cáo Lãnh đạo Vụ, họp Tổ 5 Thẩm phán, lưu trữ án</text>
    <text x="1250" y="1090" class="card-desc">• Dung lượng chuẩn: ~40 KB (gom chung 1 thư mục vụ án)</text>
  </g>

