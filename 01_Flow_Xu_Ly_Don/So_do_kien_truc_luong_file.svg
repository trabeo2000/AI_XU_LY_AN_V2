    <rect x="230" y="760" width="125" height="20" rx="4" fill="#004d26"/>
    <text x="292" y="774" class="tag" fill="#00d26a" text-anchor="middle">ĐỘNG CƠ TRỰC QUAN</text>
    <text x="230" y="805" class="card-title">🚀 universal_visual_filler.py</text>
    <text x="230" y="828" class="card-desc">• Rót dữ liệu vào Phôi Trực Quan trong &lt; 0.1 giây</text>
    <text x="230" y="848" class="card-desc">• Hỗ trợ cả Tờ trình và Quyết định Kháng nghị</text>
    <text x="230" y="868" class="card-desc" fill="#00d26a" font-weight="700">★ Thẩm tra viên tự sửa mẫu trên Word không cần code!</text>

    <!-- Card 4.2 -->
    <rect x="720" y="745" width="480" height="135" class="card-bg"/>
    <rect x="740" y="760" width="90" height="20" rx="4" fill="#003366"/>
    <text x="785" y="774" class="tag" fill="#4da3ff" text-anchor="middle">SCRIPT GỐC</text>
    <text x="740" y="805" class="card-title">📝 export_to_trinh.py &amp; export_khang_nghi.py</text>
    <text x="740" y="828" class="card-desc">• Xuất tự động nạp từ base XML gốc TANDTC</text>
    <text x="740" y="848" class="card-desc">• Dry-run mode, File-lock check, Placeholder scan</text>
    <text x="740" y="868" class="card-desc">• Tốc độ xuất &lt; 0.5 giây</text>

    <!-- Card 4.3 -->
    <rect x="1230" y="745" width="480" height="135" class="card-bg"/>
    <rect x="1250" y="760" width="80" height="20" rx="4" fill="#004d26"/>
    <text x="1290" y="774" class="tag" fill="#00d26a" text-anchor="middle">OPTION 5</text>
    <text x="1250" y="805" class="card-title">📑 export_6step_report.py</text>
    <text x="1250" y="828" class="card-desc">• Xuất Báo cáo Toàn diện Nghiên cứu Hồ sơ 6 Bước (.docx)</text>
    <text x="1250" y="848" class="card-desc">• Bảng ma trận Navy, zebra row, callout box trạng thái khóa</text>
    <text x="1250" y="868" class="card-desc">• Xuất ngay trong 1s, chấm dứt việc tự sinh code mất 5 phút</text>
  </g>

  <!-- ========================================== -->
  <!-- PHÂN VÙNG 5: SẢN PHẨM HOÀN CHỈNH ĐẦU RA -->
  <!-- ========================================== -->
  <g filter="url(#shadow)">
    <rect x="180" y="940" width="1560" height="190" class="box-bg" stroke="#00d26a" stroke-width="2"/>
    <text x="210" y="975" class="stage-title">🎯 5. SẢN PHẨM HOÀN CHỈNH BÀN GIAO THẨM TRA VIÊN (OUTPUT)</text>

    <!-- Card 5.1 -->
    <rect x="210" y="995" width="480" height="115" class="card-bg"/>
    <text x="230" y="1025" class="card-title" fill="#4da3ff">📁 03_Ket_qua_Xu_ly/01_Vu_&lt;ten_vu&gt;/To_trinh_...</text>
    <text x="230" y="1050" class="card-desc">• Tờ trình Chánh án TANDTC (gom theo hồ sơ, 01_ = mới nhất)</text>
    <text x="230" y="1070" class="card-desc">• Đầy đủ bảng tiến độ trình, danh sách đương sự, ý kiến Thẩm phán</text>
    <text x="230" y="1090" class="card-desc">• Dung lượng tối ưu: ~30 KB (giữ 100% XML &amp; VML gốc)</text>

    <!-- Card 5.2 -->
